services:
  - type: web
    name: blue-eagle-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false          # set manually in Render dashboard from Supabase
      - key: CORS_ORIGINS
        sync: false          # set to https://<your-cloudflare-pages-domain>
      - key: CLASS_WRITE_KEY
        sync: false          # optional; set any shared secret
      - key: DATA_PROVIDER
        value: yfinance
