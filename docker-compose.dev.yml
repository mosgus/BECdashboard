# Dev compose — hot reload without image rebuild for source file changes.
#
# First run (or after deps/Dockerfile change):
#   docker-compose -f docker-compose.dev.yml up --build
#
# Normal iteration (source edits only):
#   docker-compose -f docker-compose.dev.yml up
#
# Rebuild one service after package/requirements change:
#   docker-compose -f docker-compose.dev.yml up --build backend
#   docker-compose -f docker-compose.dev.yml up --build frontend
#
# Run migrations manually:
#   docker-compose -f docker-compose.dev.yml exec backend alembic upgrade head

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER:     blueeagle
      POSTGRES_PASSWORD: blueeagle
      POSTGRES_DB:       blueeagle
    volumes:
      - dev-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blueeagle"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend          # same single-stage Dockerfile; deps in system Python
    command: >
      sh -c "alembic upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app        # bind-mount source; --reload watches /app for .py changes
    environment:
      DATABASE_URL: postgresql://blueeagle:blueeagle@db:5432/blueeagle
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      target: deps            # stop after npm ci; skip Next.js production build
    command: npm run dev      # next dev -H 0.0.0.0; HMR on port 3000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app                         # bind-mount source for HMR
      - dev-frontend-modules:/app/node_modules  # named vol populated from image on first run
      - dev-frontend-next:/app/.next            # named vol; avoids macOS<->Linux binary issues
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000  # read at dev-server start; not baked
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  dev-pgdata:
  dev-frontend-modules:
  dev-frontend-next:
