services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER:     blueeagle
      POSTGRES_PASSWORD: blueeagle
      POSTGRES_DB:       blueeagle
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blueeagle"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://blueeagle:blueeagle@db:5432/blueeagle
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        # Empty string → relative URLs → always calls the same host the browser loaded from.
        # Nginx proxies /api/* to backend, so no IP is ever baked into the bundle.
        NEXT_PUBLIC_API_URL: ""
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "3000:80"   # keep :3000 working during transition
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
