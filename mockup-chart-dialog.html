<!DOCTYPE html>
<!--
  THROWAWAY MOCKUP — chart dialog for /universe. Not production code. Delete after review.
  Open directly: open mockup-chart-dialog.html

  The AAPL series is REAL: 2,689 daily closes pulled 2026-09-15, 2016-01-04 to 2026-09-14,
  auto_adjust=False. The chart, range buttons and hover readout all actually work.
  Production will use recharts; this is hand-drawn SVG purely to settle layout.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chart dialog mockup</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  :root{--color-primary:#012169;--color-accent:#F2A900;--color-bg:#f4f6fb;--color-surface:#fff;
        --color-border:#dde3f0;--color-text:#0C2340;--color-muted:#4a5d7a;--color-positive:#16a34a;
        --color-negative:#dc2626;--radius-card:.75rem;--radius-btn:.5rem;
        --font-heading:"Outfit",system-ui,sans-serif;--font-body:"DM Sans",system-ui,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--color-bg);color:var(--color-text);
       font-family:var(--font-body);display:flex;align-items:center;justify-content:center;padding:2rem}
  h1,h2{font-family:var(--font-heading);margin:0}
  .hint{position:fixed;top:1rem;left:50%;transform:translateX(-50%);font-size:.75rem;
        color:var(--color-muted);background:var(--color-surface);border:1px solid var(--color-border);
        padding:.4rem .8rem;border-radius:9999px}

  .dialog{background:var(--color-surface);border:1px solid var(--color-border);
          border-radius:var(--radius-card);width:100%;max-width:56rem;
          box-shadow:0 12px 40px rgba(12,35,64,.18);display:flex;flex-direction:column}
  .dhead{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;
         padding:1.125rem 1.25rem;border-bottom:1px solid var(--color-border)}
  .tick{font-family:var(--font-heading);font-weight:700;font-size:1.25rem;color:var(--color-primary)}
  .nm{font-size:.8125rem;color:var(--color-muted);margin-top:.15rem}
  .quote{text-align:right}
  .px{font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
  .chg{font-size:.8125rem;font-variant-numeric:tabular-nums;margin-top:.2rem}
  .up{color:var(--color-positive)} .down{color:var(--color-negative)}
  .x{background:none;border:none;font-size:1.2rem;line-height:1;color:var(--color-muted);
     cursor:pointer;padding:.15rem .3rem;border-radius:var(--radius-btn)}
  .x:hover{background:var(--color-border);color:var(--color-text)}

  .chartwrap{padding:1rem 1.25rem .25rem;position:relative}
  svg{display:block;width:100%;height:320px;overflow:visible}
  .grid{stroke:var(--color-border);stroke-width:1}
  .axis{fill:var(--color-muted);font-size:10px}
  .line{fill:none;stroke:var(--color-primary);stroke-width:1.6;
        stroke-linejoin:round;stroke-linecap:round}
  .area{fill:var(--color-primary);opacity:.06}
  .cross{stroke:var(--color-muted);stroke-width:1;stroke-dasharray:3 3}
  .dot{fill:var(--color-primary)}
  .readout{position:absolute;top:1rem;left:1.25rem;font-size:.75rem;color:var(--color-muted);
           background:color-mix(in srgb,var(--color-surface) 92%,transparent);padding:.2rem .45rem;
           border-radius:var(--radius-btn);pointer-events:none;opacity:0;transition:opacity .1s}
  .readout.on{opacity:1}
  .readout b{color:var(--color-text);font-variant-numeric:tabular-nums}

  .ranges{display:flex;gap:.25rem;padding:.5rem 1.25rem 1.25rem;flex-wrap:wrap}
  .r{font-family:var(--font-body);font-size:.75rem;font-weight:500;padding:.35rem .7rem;
     border-radius:var(--radius-btn);border:1px solid transparent;background:transparent;
     color:var(--color-muted);cursor:pointer}
  .r:hover{background:var(--color-border);color:var(--color-text)}
  .r.on{background:var(--color-primary);color:#fff}
  .r:disabled{opacity:.35;cursor:not-allowed;background:transparent;color:var(--color-muted)}
  @media(max-width:640px){ .px{font-size:1.2rem} svg{height:240px} }
</style>
</head>
<body>
<div class="hint">Mockup — click range buttons, hover the chart. Real AAPL data, 2,689 bars.</div>

<div class="dialog" role="dialog" aria-modal="true" aria-label="AAPL price chart">
  <div class="dhead">
    <div>
      <div class="tick">AAPL</div>
      <div class="nm">Apple Inc. · Technology · Equity</div>
    </div>
    <div style="display:flex;align-items:flex-start;gap:1rem">
      <div class="quote">
        <div class="px" id="px">—</div>
        <div class="chg" id="chg">—</div>
      </div>
      <button class="x" title="Close">&times;</button>
    </div>
  </div>

  <div class="chartwrap">
    <div class="readout" id="readout"></div>
    <svg id="svg" viewBox="0 0 800 320" preserveAspectRatio="none"></svg>
  </div>

  <div class="ranges" id="ranges"></div>

</div>

const START = new Date(DATA.start + 'T00:00:00');
const PTS = DATA.pts.map(([dayOffset, close]) => {
  const d = new Date(START); d.setDate(d.getDate() + dayOffset);
  return { d, close };
});
const LAST = PTS[PTS.length - 1].d;

const RANGES = [
  ['10Y', () => new Date(LAST.getFullYear() - 10, LAST.getMonth(), LAST.getDate())],
  ['5Y',  () => new Date(LAST.getFullYear() - 5,  LAST.getMonth(), LAST.getDate())],
  ['1Y',  () => new Date(LAST.getFullYear() - 1,  LAST.getMonth(), LAST.getDate())],
  ['YTD', () => new Date(LAST.getFullYear(), 0, 1)],
  ['6M',  () => { const d = new Date(LAST); d.setMonth(d.getMonth() - 6); return d; }],
  ['3M',  () => { const d = new Date(LAST); d.setMonth(d.getMonth() - 3); return d; }],
  ['1M',  () => { const d = new Date(LAST); d.setMonth(d.getMonth() - 1); return d; }],
  ['5D',  () => { const d = new Date(LAST); d.setDate(d.getDate() - 7); return d; }],
];
let active = 'YTD';
const fmtD = d => d.toISOString().slice(0, 10);
const fmtP = v => v.toFixed(2);

function slice() {
  const from = RANGES.find(r => r[0] === active)[1]();
  return PTS.filter(p => p.d >= from);
}

function draw() {
  const pts = slice();
  const svg = document.getElementById('svg');
  const W = 800, H = 320, PL = 46, PR = 8, PT = 10, PB = 22;
  if (pts.length < 2) { svg.innerHTML = '<text x="400" y="160" text-anchor="middle" class="axis">Not enough data in range</text>'; return; }

  const lo = Math.min(...pts.map(p => p.close)), hi = Math.max(...pts.map(p => p.close));
  const pad = (hi - lo) * 0.08 || 1;
  const y0 = lo - pad, y1 = hi + pad;
  const X = i => PL + (i / (pts.length - 1)) * (W - PL - PR);
  const Y = v => PT + (1 - (v - y0) / (y1 - y0)) * (H - PT - PB);

  let g = '';
  for (let k = 0; k <= 4; k++) {
    const v = y0 + (k / 4) * (y1 - y0), y = Y(v);
    g += `<line class="grid" x1="${PL}" y1="${y}" x2="${W - PR}" y2="${y}"/>`;
    g += `<text class="axis" x="${PL - 6}" y="${y + 3}" text-anchor="end">${fmtP(v)}</text>`;
  }
  const step = Math.max(1, Math.floor(pts.length / 5));
  for (let i = 0; i < pts.length; i += step) {
    g += `<text class="axis" x="${X(i)}" y="${H - 6}" text-anchor="middle">${fmtD(pts[i].d).slice(0, 7)}</text>`;
  }
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(p.close).toFixed(1)}`).join('');
  const area = `${line}L${X(pts.length - 1).toFixed(1)},${Y(y0)}L${X(0).toFixed(1)},${Y(y0)}Z`;
  svg.innerHTML = g + `<path class="area" d="${area}"/><path class="line" d="${line}"/>` +
    `<line class="cross" id="cx" x1="0" y1="${PT}" x2="0" y2="${H - PB}" style="opacity:0"/>` +
    `<circle class="dot" id="cd" r="3" style="opacity:0"/>`;

  const first = pts[0].close, last = pts[pts.length - 1].close;
  const delta = last - first, pct = (delta / first) * 100;
  document.getElementById('px').textContent = fmtP(last);
  const chg = document.getElementById('chg');
  chg.textContent = `${delta >= 0 ? '+' : ''}${fmtP(delta)} (${delta >= 0 ? '+' : ''}${pct.toFixed(2)}%) · ${active}`;
  chg.className = 'chg ' + (delta >= 0 ? 'up' : 'down');

  svg.onmousemove = e => {
    const r = svg.getBoundingClientRect();
    const px = ((e.clientX - r.left) / r.width) * W;
    let i = Math.round(((px - PL) / (W - PL - PR)) * (pts.length - 1));
    i = Math.max(0, Math.min(pts.length - 1, i));
    const cx = document.getElementById('cx'), cd = document.getElementById('cd');
    cx.setAttribute('x1', X(i)); cx.setAttribute('x2', X(i)); cx.style.opacity = 1;
    cd.setAttribute('cx', X(i)); cd.setAttribute('cy', Y(pts[i].close)); cd.style.opacity = 1;
    const ro = document.getElementById('readout');
    ro.className = 'readout on';
    ro.innerHTML = `${fmtD(pts[i].d)} &nbsp; <b>${fmtP(pts[i].close)}</b>`;
  };
  svg.onmouseleave = () => {
    document.getElementById('cx').style.opacity = 0;
    document.getElementById('cd').style.opacity = 0;
    document.getElementById('readout').className = 'readout';
  };
}

const rc = document.getElementById('ranges');
RANGES.forEach(([label, from]) => {
  const b = document.createElement('button');
  b.className = 'r' + (label === active ? ' on' : '');
  b.textContent = label;
  if (PTS.filter(p => p.d >= from()).length < 2) b.disabled = true;
  b.onclick = () => {
    active = label;
    [...rc.children].forEach(c => c.classList.toggle('on', c.textContent === label));
    draw();
  };
  rc.appendChild(b);
});
draw();
</script>
